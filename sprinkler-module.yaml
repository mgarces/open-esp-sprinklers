##################### ---- PHYSICAL BUTTON -----  ############################
binary_sensor:
  - platform: gpio
    pin: 5
    name: "Button 1"
    id: button1
    use_interrupt: true
    on_multi_click:
      # Short click - cycle through 4 zones
      - timing:
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(zone_1).turn_off();
              id(zone_2).turn_off();
              id(zone_3).turn_off();

              id(active_sprinkler) = (id(active_sprinkler) + 1) % 5;

              switch(id(active_sprinkler)) {
                case 1:
                  id(zone_1).turn_on();
                  ESP_LOGD("button", "Switched to Zone 1");
                  break;
                case 2:
                  id(zone_2).turn_on();
                  ESP_LOGD("button", "Switched to Zone 2");
                  break;
                case 3:
                  id(zone_3).turn_on();
                  ESP_LOGD("button", "Switched to Zone 3");
                  break;
                case 0:
                default:
                  ESP_LOGD("button", "All zones off");
                  break;
              }
      # Long press - start/stop cycle
      - timing:
          - ON for at least 1000ms
        then:
          - lambda: |-
              if (id(RUN_ALL_ZONES).is_running()) {
                ESP_LOGD("button", "Long press - stopping cycle");
                id(RUN_STOP_ALL).execute();
              } else {
                bool any_zone_running = id(zone_1).state || id(zone_2).state || 
                                       id(zone_3).state;

                if (any_zone_running) {
                  ESP_LOGD("button", "Long press - stopping current zone");
                  id(RUN_STOP_ALL).execute();
                  id(active_sprinkler) = 0;
                } else {
                  ESP_LOGD("button", "Long press - starting full cycle");
                  id(RUN_ALL_ZONES).execute();
                }
              }

##################### ---- SCHEDULE -----  ####################################
time:
  - platform: sntp
    id: "auto_timer_off"
    timezone: "WET0WEST,M3.5.0/1,M10.5.0"
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

    on_time:
      # Safety shutdowns
      - seconds: 0
        minutes: 30
        hours: 23
        then:
          - logger.log: "Safety shutdown - 23:30"
          - script.execute: RUN_STOP_ALL

      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - logger.log: "Safety shutdown - 00:00"
          - script.execute: RUN_STOP_ALL

# Dynamic schedule checker using persistent globals
interval:
  - interval: 30s
    then:
      - lambda: |-
          auto time = id(auto_timer_off).now();
          if (!time.is_valid()) return;

          int current_hour = time.hour;
          int current_minute = time.minute;
          int current_second = time.second;
          int current_day_of_week = time.day_of_week;

          int target_hour = id(stored_schedule_hour);
          int target_minute = id(stored_schedule_minutes);
          bool schedule_enabled_state = (id(stored_schedule_enabled) == 1);

          std::vector<std::string> day_options = {"Daily", "Weekdays", "Weekends", "Monday", "Tuesday", 
                                                 "Wednesday", "Thursday", "Friday", "Saturday", "Sunday", 
                                                 "Mon,Wed,Fri", "Tue,Thu,Sat", "Disabled"};
          int day_index = id(stored_schedule_days);
          std::string days = (day_index >= 0 && day_index < day_options.size()) ? day_options[day_index] : "Daily";

          if (!schedule_enabled_state || days == "Disabled") return;

          bool time_match = (current_hour == target_hour && current_minute == target_minute && current_second < 30);
          if (!time_match) return;

          static uint32_t last_run_time = 0;
          uint32_t current_time_minutes = current_hour * 60 + current_minute;
          if (last_run_time == current_time_minutes) return;

          bool day_match = false;

          if (days == "Daily") {
            day_match = true;
          } else if (days == "Weekdays" && current_day_of_week >= 2 && current_day_of_week <= 6) {
            day_match = true;
          } else if (days == "Weekends" && (current_day_of_week == 1 || current_day_of_week == 7)) {
            day_match = true;
          } else if (days == "Monday" && current_day_of_week == 2) {
            day_match = true;
          } else if (days == "Tuesday" && current_day_of_week == 3) {
            day_match = true;
          } else if (days == "Wednesday" && current_day_of_week == 4) {
            day_match = true;
          } else if (days == "Thursday" && current_day_of_week == 5) {
            day_match = true;
          } else if (days == "Friday" && current_day_of_week == 6) {
            day_match = true;
          } else if (days == "Saturday" && current_day_of_week == 7) {
            day_match = true;
          } else if (days == "Sunday" && current_day_of_week == 1) {
            day_match = true;
          } else if (days == "Mon,Wed,Fri" && (current_day_of_week == 2 || current_day_of_week == 4 || current_day_of_week == 6)) {
            day_match = true;
          } else if (days == "Tue,Thu,Sat" && (current_day_of_week == 3 || current_day_of_week == 5 || current_day_of_week == 7)) {
            day_match = true;
          }

          if (day_match) {
            ESP_LOGI("schedule", "🚿 SCHEDULE TRIGGERED! Starting watering cycle");
            last_run_time = current_time_minutes;
            id(RUN_ALL_ZONES).execute();
          }

