###################################################################################
############### -------CONFIG ------- #############################################
substitutions:
  devicename: sprinkler-esp32c3
  friendlyname: sprinkler-esp32c3
  ip: !secret ip_sprinklers
  gw: 192.168.1.1
  cidr: 255.255.255.0
  dns: 1.1.1.1
  ap_ssid: esp32-ap-recovery
  ap_password: !secret ip_sprinklers
##################---- END OF CONFIG ---- #########################################
###################################################################################
esphome:
  name: ${devicename}
  friendly_name: ${friendlyname}
  name_add_mac_suffix: false
  project:
    name: "sprinkler.controller"
    version: "1.0"
  # Boot sequence to show restored values
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          ESP_LOGI("boot", "=== PERSISTENT VALUES RESTORED ===");
          ESP_LOGI("boot", "Zone runtimes and schedule loaded from flash");
          ESP_LOGI("boot", "stored_schedule_enabled value: %d", id(stored_schedule_enabled));
          ESP_LOGI("boot", "All other persistent values:");
          ESP_LOGI("boot", "Zone 1 runtime index: %d", id(stored_zone_1_runtime_index));
          ESP_LOGI("boot", "Zone 2 runtime index: %d", id(stored_zone_2_runtime_index));
          ESP_LOGI("boot", "Zone 3 runtime index: %d", id(stored_zone_3_runtime_index));
          ESP_LOGI("boot", "Schedule hour: %d", id(stored_schedule_hour));
          ESP_LOGI("boot", "Schedule minutes: %d", id(stored_schedule_minutes));
          ESP_LOGI("boot", "Schedule days: %d", id(stored_schedule_days));

          // Force schedule switch to sync with stored value
          if (id(stored_schedule_enabled) == 1) {
            ESP_LOGI("boot", "Setting schedule switch to ON");
            id(schedule_enabled).turn_on();
          } else {
            ESP_LOGI("boot", "Setting schedule switch to OFF"); 
            id(schedule_enabled).turn_off();
          }
esp32:
  board: esp32-c3-devkitm-1
  framework: 
    type: arduino
# Enable logging
logger:
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_sprinklers
ota:
  platform: esphome
  password: !secret ota_password_sprinklers
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${ip}
    gateway: ${gw}
    subnet: ${cidr}
    dns1: ${dns}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
    manual_ip:
      static_ip: 192.168.100.1
      gateway: 192.168.100.1
      subnet: 255.255.255.0
      dns1: 8.8.8.8
      dns2: 8.8.4.4
web_server:
  port: 80
###################################################################################
###################################################################################
# Add explicit preferences component for better control
preferences:
  flash_write_interval: 30s  # Save to flash every 30 seconds
# sprinkler state + PERSISTENT CONFIGURATION STORAGE
###################################################################################
globals:
   - id: active_sprinkler
     type: int
     restore_value: yes
     initial_value: '0'
   # Individual zone start times for timer tracking (4 zones only)
   - id: zone_1_start_time
     type: uint32_t
     restore_value: no
     initial_value: '0'
   - id: zone_2_start_time
     type: uint32_t
     restore_value: no
     initial_value: '0'
   - id: zone_3_start_time
     type: uint32_t
     restore_value: no
     initial_value: '0'

   # PERSISTENT CONFIGURATION GLOBALS (survive power outages) - using INDEX SYSTEM
   - id: stored_zone_1_runtime_index
     type: int
     restore_value: yes
     initial_value: '15'  # Default to "10 minutes" (index 15)
   - id: stored_zone_2_runtime_index
     type: int
     restore_value: yes
     initial_value: '15'  # Default to "10 minutes" (index 15)
   - id: stored_zone_3_runtime_index
     type: int
     restore_value: yes
     initial_value: '15'  # Default to "10 minutes" (index 15)
   - id: stored_schedule_hour
     type: int
     restore_value: yes
     initial_value: '21'
   - id: stored_schedule_minutes
     type: int
     restore_value: yes
     initial_value: '30'
   - id: stored_schedule_days
     type: int
     restore_value: yes
     initial_value: '0'  # 0=Daily
   - id: stored_schedule_enabled
     type: int
     restore_value: yes
     initial_value: '1'

###################################################################################
##################### ---- ALL SCRIPTS -----  ####################################
script:
  # Simple flash sync notification
  - id: force_flash_sync
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("config", "Settings updated - will auto-save to flash");

  # 4-zone script using persistent runtime values
  - id: RUN_ALL_ZONES
    mode: single
    then:
      - logger.log: "Starting automatic watering cycle"
      - logger.log: "Starting Zone 1"
      - switch.turn_on: zone_1
      - wait_until:
          condition:
            switch.is_off: zone_1
      - logger.log: "Starting Zone 2"
      - switch.turn_on: zone_2
      - wait_until:
          condition:
            switch.is_off: zone_2
      - logger.log: "Starting Zone 3"
      - switch.turn_on: zone_3
      - wait_until:
          condition:
            switch.is_off: zone_3
      - logger.log: "Automatic watering cycle complete!"

  # Stop script for 4 zones only
  - id: RUN_STOP_ALL
    mode: single
    then:
      - script.stop: RUN_ALL_ZONES 
      - logger.log: "Stopping all sprinklers"
      - switch.turn_off: zone_1
      - switch.turn_off: zone_2
      - switch.turn_off: zone_3
