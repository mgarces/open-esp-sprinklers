##################### ---- SENSORS -----  ####################################
sensor:
  # Timer sensor for 4 zones using persistent runtime values
  - platform: template
    name: "Sprinkler Timer Remaining"
    id: timer_remaining
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      std::vector<uint32_t> runtime_values = {
        10000, 30000, 60000, 90000, 120000, 150000, 180000, 210000, 240000, 270000,
        300000, 360000, 420000, 480000, 540000, 600000, 720000, 900000, 1080000, 1200000,
        1500000, 1800000, 2100000, 2400000, 2700000, 3000000, 3300000, 3600000
      };

      if (id(zone_1).state && id(zone_1_start_time) > 0) {
        int index = id(stored_zone_1_runtime_index);
        uint32_t duration = (index >= 0 && index < runtime_values.size()) ? runtime_values[index] : 600000;
        uint32_t elapsed = millis() - id(zone_1_start_time);
        uint32_t remaining = (duration > elapsed) ? (duration - elapsed) / 1000 : 0;
        return remaining;
      }
      if (id(zone_2).state && id(zone_2_start_time) > 0) {
        int index = id(stored_zone_2_runtime_index);
        uint32_t duration = (index >= 0 && index < runtime_values.size()) ? runtime_values[index] : 600000;
        uint32_t elapsed = millis() - id(zone_2_start_time);
        uint32_t remaining = (duration > elapsed) ? (duration - elapsed) / 1000 : 0;
        return remaining;
      }
      if (id(zone_3).state && id(zone_3_start_time) > 0) {
        int index = id(stored_zone_3_runtime_index);
        uint32_t duration = (index >= 0 && index < runtime_values.size()) ? runtime_values[index] : 600000;
        uint32_t elapsed = millis() - id(zone_3_start_time);
        uint32_t remaining = (duration > elapsed) ? (duration - elapsed) / 1000 : 0;
        return remaining;
      }
      return 0;

text_sensor:
  # Status sensor for 4 zones only
  - platform: template
    name: "Sprinkler Status"
    id: sprinkler_status
    update_interval: 1s
    lambda: |-
      if (id(RUN_ALL_ZONES).is_running()) {
        if (id(zone_1).state) return {"Zone 1 Auto"};
        if (id(zone_2).state) return {"Zone 2 Auto"};
        if (id(zone_3).state) return {"Zone 3 Auto"};
        return {"Cycle Starting..."};
      } else if (id(zone_1).state || id(zone_2).state || id(zone_3).state) {
        if (id(zone_1).state) return {"Zone 1 Manual"};
        if (id(zone_2).state) return {"Zone 2 Manual"};
        if (id(zone_3).state) return {"Zone 3 Manual"};
      }
      return {"Idle"};

  # Configuration display using persistent globals
  - platform: template
    name: "Sprinkler Configuration"
    id: sprinkler_config
    icon: "mdi:cog"
    update_interval: 30s
    lambda: |-
      std::vector<std::string> runtime_options = {"10 seconds", "30 seconds", "1 minute", "1.5 minutes", 
                                                  "2 minutes", "2.5 minutes", "3 minutes", "3.5 minutes", 
                                                  "4 minutes", "4.5 minutes", "5 minutes", "6 minutes", 
                                                  "7 minutes", "8 minutes", "9 minutes", "10 minutes", 
                                                  "12 minutes", "15 minutes", "18 minutes", "20 minutes", 
                                                  "25 minutes", "30 minutes", "35 minutes", "40 minutes", 
                                                  "45 minutes", "50 minutes", "55 minutes", "60 minutes"};

      std::string config = "";

      config += "SCHEDULE: ";
      if (id(stored_schedule_enabled) == 0) {
        config += "DISABLED";
      } else {
        std::vector<std::string> day_options = {"Daily", "Weekdays", "Weekends", "Monday", "Tuesday", 
                                               "Wednesday", "Thursday", "Friday", "Saturday", "Sunday", 
                                               "Mon,Wed,Fri", "Tue,Thu,Sat", "Disabled"};
        int day_index = id(stored_schedule_days);
        if (day_index >= 0 && day_index < day_options.size()) {
          if (day_options[day_index] == "Disabled") {
            config += "DISABLED";
          } else {
            config += day_options[day_index];
            char time_buffer[6];
            snprintf(time_buffer, sizeof(time_buffer), " at %02d:%02d", 
                    id(stored_schedule_hour), id(stored_schedule_minutes));
            config += std::string(time_buffer);
          }
        } else {
          config += "ERROR";
        }
      }
      config += "\n\n";

      config += "ZONE TIMES:\n";

      int idx1 = id(stored_zone_1_runtime_index);
      std::string zone1_time = (idx1 >= 0 && idx1 < runtime_options.size()) ? runtime_options[idx1] : "ERROR";
      config += "Zone 1: " + zone1_time + "\n";

      int idx2 = id(stored_zone_2_runtime_index);
      std::string zone2_time = (idx2 >= 0 && idx2 < runtime_options.size()) ? runtime_options[idx2] : "ERROR";
      config += "Zone 2: " + zone2_time + "\n";

      int idx3 = id(stored_zone_3_runtime_index);
      std::string zone3_time = (idx3 >= 0 && idx3 < runtime_options.size()) ? runtime_options[idx3] : "ERROR";
      config += "Zone 3: " + zone3_time + "\n";

      config += "💾 PERSISTENT STORAGE ✅";

      return config;

##################### ---- BUTTONS -----  ######################
button:
    - platform: template
      name: "RUN ALL ZONES"
      id: button_run_sequence
      icon: "mdi:play-circle"
      on_press:
        - if:
            condition:
              lambda: 'return id(RUN_ALL_ZONES).is_running();'
            then:
              - logger.log: "Stopping running cycle"
              - script.execute: RUN_STOP_ALL
            else:
              - logger.log: "Starting zones sequence manually"
              - script.execute: RUN_ALL_ZONES

    - platform: template
      name: "STOP ALL"
      icon: "mdi:stop"
      id: button_stop_all
      on_press:
        - logger.log: "Stopping all sprinklers"
        - script.execute: RUN_STOP_ALL

##################### ---- SWITCHES/RELAYS -----  ############################
switch:   
  # FIXED: Schedule enable/disable switch - now properly persistent
  - platform: template
    name: "Schedule Enabled"
    id: schedule_enabled
    icon: "mdi:calendar-check"
    restore_mode: RESTORE_DEFAULT_OFF  # Add this line
    lambda: "return id(stored_schedule_enabled) == 1;"
    turn_on_action:
      then:
        - lambda: |-
            id(stored_schedule_enabled) = 1;
            ESP_LOGI("config", "Schedule enabled");
        - script.execute: force_flash_sync
    turn_off_action:
      then:
        - lambda: |-
            id(stored_schedule_enabled) = 0;
            ESP_LOGI("config", "Schedule disabled");
        - script.execute: force_flash_sync

  # 4-channel GPIO relays with persistent runtime
  - platform: gpio
    name: "Zone 1"
    pin: 2
    inverted: True
    id: zone_1
    icon: "mdi:sprinkler-variant"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.log: "Starting Zone 1"
      - lambda: 'id(zone_1_start_time) = millis();'
      - switch.turn_off: zone_2
      - switch.turn_off: zone_3
      - delay: !lambda |-
          std::vector<uint32_t> runtime_values = {
            10000, 30000, 60000, 90000, 120000, 150000, 180000, 210000, 240000, 270000,
            300000, 360000, 420000, 480000, 540000, 600000, 720000, 900000, 1080000, 1200000,
